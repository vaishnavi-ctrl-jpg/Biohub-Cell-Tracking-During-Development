[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-tracking"
version = "0.1.0"
description = "Production-Grade Cell Tracking Pipeline for CZ Biohub Competition"
readme = "README.md"
authors = [
    { name = "Lead AI Software Engineer", email = "researcher@biohub-tracking.org" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-image>=0.19.0",
    "torch>=2.0.0",
    "zarr>=2.12.0",
    "pandas>=1.4.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=12.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cell_tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
